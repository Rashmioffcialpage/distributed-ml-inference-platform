name: Python ML CI

on:
  push:
    branches: [main]
    paths: ["ml/**", "tests/ml/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["ml/**", "tests/ml/**", ".github/workflows/python-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ml -v

      - name: Train + evaluate event classifier (smoke test)
        run: |
          python ml/training/train_event_classifier.py --version ci-smoke --epochs 3 --train-size 2000 --val-size 500
          python ml/evaluation/evaluate.py --model event_classifier --version ci-smoke --n 500

      - name: Quantization benchmark (smoke test)
        run: python ml/quantization/benchmark.py --version ci-smoke --n 200
