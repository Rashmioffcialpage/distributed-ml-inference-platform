apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: teslaedge
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: "teslaedge" }
            - { name: POSTGRES_DB, value: "teslaedge" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: teslaedge-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "teslaedge"] }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: teslaedge
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
