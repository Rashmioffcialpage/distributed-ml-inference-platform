apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-deployer
  namespace: teslaedge
spec:
  replicas: 1
  selector:
    matchLabels: { app: model-deployer }
  template:
    metadata:
      labels: { app: model-deployer }
    spec:
      containers:
        - name: model-deployer
          image: teslaedge/model-deployer:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: teslaedge-config }
          env:
            - { name: DEPLOYER_ADDR, value: ":8081" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: model-deployer
  namespace: teslaedge
spec:
  selector: { app: model-deployer }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
