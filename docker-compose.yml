name: teslaedge

x-go-service: &go-service-defaults
  build:
    context: .
    dockerfile: deployments/docker/Dockerfile.go-service
  restart: unless-stopped

services:
  # ---- infrastructure -------------------------------------------------
  # Images below are pulled via mirror.gcr.io — Google's public,
  # unauthenticated Docker Hub mirror (the same one GKE nodes use by
  # default) — for resilience against Docker Hub rate limits/outages, not
  # because these are anything other than the standard upstream images.
  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: teslaedge
      POSTGRES_PASSWORD: teslaedge
      POSTGRES_DB: teslaedge
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslaedge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional alternative messaging backend to Redis Streams — start with
  # `docker compose --profile kafka up` and set QUEUE_BACKEND=kafka on the
  # scheduler/gateway to exercise it instead.
  kafka:
    image: mirror.gcr.io/apache/kafka:3.8.0
    profiles: ["kafka"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  jaeger:
    image: mirror.gcr.io/jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v2.53.0
    ports: ["9099:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: teslaedge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # ---- Go services ------------------------------------------------------
  router:
    <<: *go-service-defaults
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: router-go
        CMD_PATH: ./cmd/router
    environment:
      ROUTER_GRPC_ADDR: ":9090"
      ROUTER_METRICS_ADDR: ":9091"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
      WORKER_STALE_AFTER: "30s"
    ports: ["9090:9090", "9091:9091"]
    depends_on: [jaeger]

  gateway:
    <<: *go-service-defaults
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: gateway-go
        CMD_PATH: ./cmd/gateway
    environment:
      GATEWAY_ADDR: ":8080"
      ROUTER_GRPC_ADDR: "router:9090"
      QUEUE_BACKEND: "redis"
      REDIS_ADDR: "redis:6379"
      GATEWAY_API_KEYS: "devkey"
      RATE_LIMIT_RPS: "200"
      RATE_LIMIT_BURST: "400"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    ports: ["8080:8080"]
    depends_on:
      router: { condition: service_started }
      redis: { condition: service_healthy }

  scheduler:
    <<: *go-service-defaults
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: scheduler-go
        CMD_PATH: ./cmd/scheduler
    environment:
      SCHEDULER_METRICS_ADDR: ":9092"
      ROUTER_GRPC_ADDR: "router:9090"
      QUEUE_BACKEND: "redis"
      REDIS_ADDR: "redis:6379"
      RETRY_BACKOFF: "200ms"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    ports: ["9092:9092"]
    depends_on:
      router: { condition: service_started }
      redis: { condition: service_healthy }

  model-deployer:
    <<: *go-service-defaults
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: model-deployer-go
        CMD_PATH: ./cmd/deployer
    environment:
      DEPLOYER_ADDR: ":8081"
      POSTGRES_DSN: "postgres://teslaedge:teslaedge@postgres:5432/teslaedge?sslmode=disable"
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  fleet-simulator:
    <<: *go-service-defaults
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: fleet-simulator-go
        CMD_PATH: ./cmd/simulator
    environment:
      SIMULATOR_METRICS_ADDR: ":9093"
      GATEWAY_URL: "http://gateway:8080"
      GATEWAY_API_KEY: "devkey"
      FLEET_SIZE: "200"
      TELEMETRY_PERIOD: "1s"
      INFER_EVERY_N_TICKS: "5"
    ports: ["9093:9093"]
    depends_on: [gateway]

  # ---- ML inference workers ---------------------------------------------
  # Two workers at different precisions, both serving the same model
  # version, so the router's precision-aware selection has something real
  # to choose between (see services/router-go/internal/routing/selector.go).
  ml-worker-fp32:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.ml-worker
    # Both worker services build from the identical Dockerfile/context and
    # differ only by runtime env vars (MODEL_PRECISION) — a single shared
    # image tag means `docker compose build` builds it once instead of
    # twice (the model itself is precision-converted at startup in
    # ml/serving/server.py, not baked into the image).
    image: teslaedge/ml-worker:latest
    restart: unless-stopped
    environment:
      WORKER_ID: "worker-fp32-1"
      WORKER_PORT: "8100"
      WORKER_ENDPOINT: "http://ml-worker-fp32:8100"
      ROUTER_GRPC_ADDR: "router:9090"
      MODEL_VERSION: "v1"
      MODEL_PRECISION: "fp32"
    ports: ["8100:8100"]
    depends_on: [router]

  ml-worker-int8:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.ml-worker
    image: teslaedge/ml-worker:latest
    restart: unless-stopped
    environment:
      WORKER_ID: "worker-int8-1"
      WORKER_PORT: "8100"
      WORKER_ENDPOINT: "http://ml-worker-int8:8100"
      ROUTER_GRPC_ADDR: "router:9090"
      MODEL_VERSION: "v1"
      MODEL_PRECISION: "int8"
    ports: ["8101:8100"]
    depends_on: [router]

volumes:
  postgres-data:
